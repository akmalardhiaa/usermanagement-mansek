# The portal at the office: two containers, from images loaded with
# `podman load` (no internet needed), or built here with `--build`.
#
#   podman compose -f compose.production.yml up -d
#
# Settings: .env.production.local (copy deploy/windows/env.production.example).
# The portal listens on 127.0.0.1:3000 only; IIS in front of it serves HTTPS
# to the office (deploy/windows/web.config). Guide: PANDUAN-PC-KANTOR.md.

name: hc

services:
  portal:
    image: hc-portal:latest
    build:
      context: ./portal
      dockerfile: Containerfile
    container_name: hc-portal
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production.local
    environment:
      APP_ENV: production
      AD_SERVICE_URL: http://ad-service:8081
    volumes:
      # A named volume keeps the JSON store on the Linux VM filesystem, where
      # atomic rename works reliably; do not replace it with a Windows folder.
      - hc-portal-data:/app/data
    # Declared here: Podman builds OCI images, and OCI drops HEALTHCHECK.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - ad-service
    restart: always

  # Talks to the domain controllers over LDAPS. No ports: only the portal
  # reaches it, with the shared AD_SERVICE_TOKEN.
  ad-service:
    image: hc-ad-service:latest
    build:
      context: ./ad-service
      dockerfile: Containerfile
    container_name: hc-ad-service
    env_file:
      - .env.production.local
    environment:
      APP_ENV: production
    volumes:
      # The company root CA, exported as PEM. Add :Z only on an SELinux host.
      - ./certs/corp-root-ca.pem:/run/certs/corp-root-ca.pem:ro
    restart: always

volumes:
  hc-portal-data:
    name: hc-portal-data
