name: CI

# Every push and every pull request: "it all passes" is a condition for
# merging, not something somebody remembered to check locally.
on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    name: Portal (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portal/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  ad-service:
    name: AD service (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ad-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test

  # The images are not published anywhere; this only proves both
  # Containerfiles still build with Podman on Linux.
  images:
    name: Container images (Podman)
    runs-on: ubuntu-latest
    needs: [portal, ad-service]
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install --yes podman
      - run: podman build --tag hc-portal:ci portal
      - run: podman build --tag hc-ad-service:ci ad-service
