# The rewrite (Python portal + Java AD service), for trying on a PC.
#
#   podman compose -f compose.v2.yaml up -d --build
#
# Then open http://localhost:3001. Settings come from .env.v2.local (copy
# .env.v2.example). The earlier TypeScript portal keeps port 3000, so both can
# run side by side while the rewrite catches up.

# Its own project: the earlier compose.yaml in this folder also has a service
# named `portal`, and sharing the folder's default project name made one
# replace the other.
name: hc-v2

services:
  portal:
    build:
      context: ./portal
      dockerfile: Containerfile
    container_name: hc-portal-v2
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - path: .env.v2.local
        required: true
    environment:
      AD_SERVICE_URL: http://ad-service:8081
      APP_BASE_URL: http://localhost:3001
    volumes:
      - hc-v2-data:/app/data
    depends_on:
      - ad-service
    restart: unless-stopped

  # No ports: reachable only from the portal, inside this network.
  ad-service:
    build:
      context: ./ad-service
      dockerfile: Containerfile
    container_name: hc-ad-service
    env_file:
      - path: .env.v2.local
        required: true
    volumes:
      # The company CA, read-only, when AD is configured.
      - ./certs:/run/certs:ro
    restart: unless-stopped

volumes:
  hc-v2-data:
    name: hc-v2-data
